<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tana PGP - Options</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
</head>

<body style="margin-right: 10%; margin-left: 10%; margin-top: 5em; margin-bottom: 5em;">
    <h1>Tana PGP - Options</h1>
    <p>Simple, fast, secure</p>
    <a href="about.html">About the extension</a>
    <hr>

    <form>
        <div class="container">
            <div class="row">
                <div class="col">
                    <h3>Public Key</h3>
                    <textarea name="public-key" id="public-key" cols="30" rows="10"></textarea>
                </div>

                <div class="col">
                    <h3>Private Key</h3>
                    <textarea name="private-key" id="private-key" cols="30" rows="10"></textarea>
                </div>
            </div>
        </div>
    </form>

    <button id="modify-key" type="button" style="margin-top: 1em; margin-bottom: 2em;">Modify Key Pair</button>
    <button id="generate-key" type="button" style="margin-top: 1em; margin-bottom: 2em;">Generate Key Pair</button>
    <button id="delete-keys" type="button" style="margin-right: 10em;">Delete Key Pair</button>

    <script src="../js/js-encrypt.js"></script>
    <script src="options.js"></script>
</body>

</html>
